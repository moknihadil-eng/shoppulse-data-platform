name: shoppulse
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Create .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Create .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    build: ./infrastructure/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Create .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Create .env first}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  foundation:
    build: ./infrastructure/foundation
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Create .env first}
      PGUSER: ${POSTGRES_USER:?Create .env first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Create .env first}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Create .env first}
      RAW_BUCKET: ${RAW_BUCKET:-shoppulse-raw}
    volumes:
      - ./infrastructure/postgres:/sql:ro
      - ./.local:/reports
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: [init]
    restart: 'no'
  source-api:
    build: ./ingestion
    entrypoint: [python, api.py]
    volumes:
      - ./ingestion/fixtures:/app/fixtures:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ingestion:
    build: ./ingestion
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Create .env first}
      PGUSER: ${POSTGRES_USER:?Create .env first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Create .env first}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Create .env first}
      RAW_BUCKET: ${RAW_BUCKET:-shoppulse-raw}
    volumes:
      - ./ingestion/fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      source-api:
        condition: service_healthy
    restart: 'no'
  warehouse:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-shoppulse_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:?Create .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      TZ: UTC
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  platform:
    image: shoppulse-platform:local
    mem_limit: 768m
    cpus: 2.0
    build:
      context: .
      dockerfile: platform/Dockerfile
    environment: &platform_env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Create .env first}
      PGUSER: ${POSTGRES_USER:?Create .env first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Create .env first}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Create .env first}
      RAW_BUCKET: ${RAW_BUCKET:-shoppulse-raw}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-shoppulse_warehouse}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@shoppulse.test}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?Add Metabase password to .env}
      METABASE_READ_PASSWORD: ${METABASE_READ_PASSWORD:?Add reader password to .env}
      METABASE_PORT: ${METABASE_PORT:-3001}
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      TZ: UTC
    volumes: &platform_volumes
      - ./ingestion/fixtures:/app/fixtures:ro
      - ./.local/reports:/reports
      - dagster_data:/dagster/home
    depends_on:
      warehouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      source-api:
        condition: service_healthy
    command: [run]
    restart: 'no'
  dagster:
    image: shoppulse-platform:local
    mem_limit: 1024m
    cpus: 2.0
    build:
      context: .
      dockerfile: platform/Dockerfile
    entrypoint: [dagster, dev, -h, 0.0.0.0, -p, '3000', -w, /app/orchestration/workspace.yaml]
    environment: *platform_env
    volumes: *platform_volumes
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    depends_on:
      warehouse:
        condition: service_healthy
      source-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped
  metabase-db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_ADMIN_PASSWORD:?Add Metabase password to .env}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  metabase:
    image: metabase/metabase:v0.64.1
    mem_limit: 1280m
    cpus: 2.0
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_ADMIN_PASSWORD:?Add Metabase password to .env}
      JAVA_OPTS: -Xms128m -Xmx384m -XX:ActiveProcessorCount=2 -XX:ReservedCodeCacheSize=96m
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3001}
    ports:
      - "127.0.0.1:${METABASE_PORT:-3001}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 40
    restart: unless-stopped
  dbt-docs:
    image: python:3.13.7-slim-bookworm
    command: [python, -m, http.server, '8080', --directory, /docs]
    volumes:
      - ./.local/reports/dbt-docs:/docs:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
  warehouse_data:
  dagster_data:
  metabase_data:
